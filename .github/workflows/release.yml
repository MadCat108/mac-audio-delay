name: Build and test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app locally from source
        run: ./scripts/build-app.sh
      - name: Verify architecture
        run: |
          file "build/Audio Delay.app/Contents/MacOS/AudioDelay"
          test "$(uname -m)" = "arm64"
          codesign --verify --deep --strict --verbose=2 "build/Audio Delay.app"
